stages:
  prepare:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - data/raw/enron_spam_data.csv
    params:
      - dataset
    outs:
      - data/processed/train.csv
      - data/processed/val.csv
      - data/processed/test.csv

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/train.csv
      - data/processed/val.csv
    params:
      - tfidf
      - logistic_regression
      - naive_bayes
      - mlflow
    outs:
      - models/candidate_pipeline.joblib
      - models/model_metadata.json

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/candidate_pipeline.joblib
      - data/processed/test.csv
    params:
      - quality_gate
      - mlflow
    outs:
      - models/spam_pipeline.joblib
    metrics:
      - models/evaluation_results.json:
          cache: false

