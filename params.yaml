dataset:
  raw_path: "data/raw/enron_spam_data.csv"
  processed_dir: "data/processed"
  random_seed: 42
  test_size: 0.15
  val_size: 0.15
  train_size: 0.70

tfidf:
  max_features: 25000
  ngram_min: 1
  ngram_max: 2
  stop_words: "english"
  sublinear_tf: true

logistic_regression:
  C: 2.0
  max_iter: 1000
  class_weight: "balanced"
  random_state: 42

naive_bayes:
  alpha: 0.1

quality_gate:
  min_f1_score: 90.0
  min_accuracy: 90.0
  min_spam_precision: 88.0
  max_false_positive_rate_percent: 3.0

mlflow:
  experiment_name: "Spam_Email_Detection_System"
  tracking_uri: "./mlruns"
  registered_model_name: "MailGuard_Spam_Classifier"

monitoring:
  reference_data_path: "data/processed/train.csv"
  production_log_path: "data/monitoring/prediction_logs.jsonl"
  drift_report_html: "reports/monitoring/data_drift_report.html"
  drift_metrics_json: "reports/monitoring/drift_metrics.json"
  drift_share_threshold: 0.30
  p_value_threshold: 0.05
  min_samples_for_drift: 20
